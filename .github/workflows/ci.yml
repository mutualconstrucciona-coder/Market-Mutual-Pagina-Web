name: Market Mutual CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Catalog tests
        run: pnpm test:admin
      - name: Production build
        run: pnpm build
